<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daud Fabrics — Admin Login</title><meta name="robots" content="noindex,nofollow,noarchive"><style>body{font-family:Arial,sans-serif;background:#f5f7fb;min-height:100vh;display:grid;place-items:center;margin:0;color:#172033}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border-radius:14px;box-shadow:0 15px 45px rgba(0,0,0,.12)}h1{margin-top:0}.muted{color:#64748b;font-size:14px;line-height:1.5}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.error{color:#b91c1c;margin-top:14px;display:none}</style><link rel="stylesheet" href="css/responsive.css"></head><body><main class="card"><h1>🔐 Admin Login</h1><p class="muted">Restricted store-owner area. Authentication is verified on the Vercel server.</p><form id="loginForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in</button><div id="error" class="error"></div></form></main><script>const f=document.getElementById('loginForm'),e=document.getElementById('error');f.addEventListener('submit',async x=>{x.preventDefault();e.style.display='none';try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.authenticated){e.textContent=d.error||'Invalid admin credentials.';e.style.display='block';return}window.location.replace('/admin-dashboard.html')}catch(_){e.textContent='Login service is unavailable. Please try again.';e.style.display='block'}});</script></body></html>
